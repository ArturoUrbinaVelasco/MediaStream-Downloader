services:
  - type: web
    name: mediastream-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: FILE_TTL_SECONDS
        value: 1800
      - key: MAX_CONCURRENT_DOWNLOADS
        value: 5
