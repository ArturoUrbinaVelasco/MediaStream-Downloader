version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediastream_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - DEBUG=False
      - FILE_TTL_SECONDS=1800
      - MAX_CONCURRENT_DOWNLOADS=5
    volumes:
      - mediastream_cache:/app/temp_downloads
    networks:
      - mediastream_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediastream_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - mediastream_network

networks:
  mediastream_network:
    driver: bridge

volumes:
  mediastream_cache:
    driver: local
